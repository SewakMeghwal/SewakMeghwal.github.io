<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Messages</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Contact Messages</h1>
        <div class="bg-white rounded-lg shadow-md p-6">
            {% if messages %}
                <div class="space-y-4">
                    {% for msg in messages %}
                        <div class="border-b border-gray-200 pb-4">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-lg font-semibold">{{ msg.name }}</h3>
                                <span class="text-sm text-gray-500">{{ msg.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</span>
                            </div>
                            <p class="text-gray-600 mb-1"><strong>Email:</strong> {{ msg.email }}</p>
                            <p class="text-gray-800">{{ msg.message }}</p>
                        </div>
                    {% endfor %}
                </div>
            {% else %}
                <p class="text-center text-gray-500">No messages yet.</p>
            {% endif %}
        </div>
        <div class="text-center mt-8">
            <a href="/logout" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded mr-4">
                Logout
            </a>
            <a href="/" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Back to Portfolio
            </a>
        </div>
    </div>
</body>
</html>
